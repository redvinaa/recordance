<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.json?v=30"><link rel="icon" href="/icon.svg?v=30" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=30"><link rel="stylesheet" href="/style.css?v=30"><title>Recordance</title>
</head>
<body>
<svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l10-2v13M9 18c0 1.4-1.4 2.5-3 2.5S3 19.7 3 18.5 4.4 16 6 16s3 .8 3 2Zm10-2c0 1.4-1.4 2.5-3 2.5s-3-.8-3-2 1.4-2.5 3-2.5 3 .8 3 2Z"/></symbol><symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h3l1.5-2h7L17 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></symbol><symbol id="i-camera-off" viewBox="0 0 24 24"><path d="M4 7h3l1.5-2h7L17 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/><path d="M3 3l18 18"/></symbol><symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol><symbol id="i-again" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8L4 9M4 4v5h5"/></symbol></svg>
<main><header><h1><img src="/icon.svg?v=30" alt="" class="brand-icon">Recordance</h1></header>
<section id="setup">
  <div id="liveFrame" class="video-frame empty"><video id="live" playsinline muted autoplay></video><video id="preview" playsinline controls hidden></video><img id="photoPreview" class="photo-preview" alt="Captured photo" hidden><div id="level" class="level" hidden aria-label="Camera level"><div class="level-side level-left"></div><div id="levelBar" class="level-center"></div><div class="level-side level-right"></div></div><div id="countdown" class="countdown" hidden aria-live="assertive"></div><div class="camera-placeholder"><svg class="icon"><use href="#i-camera"/></svg><span>Camera preview</span></div></div>
  <div class="song-row"><label class="file row-button"><span class="icon-tile"><svg class="icon"><use href="#i-music"/></svg></span><span class="row-text"><strong>Choose a song</strong><small id="songName">Select an audio file from Files</small></span><span class="chevron" aria-hidden="true">›</span><input id="song" type="file" accept=".mp3,.m4a,.aac,.wav,.aiff,.aif,.flac,.ogg,.opus"></label><button id="demo" type="button" aria-label="Preview song" class="demo" disabled><svg class="demo-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.5v15l12-7.5z"/></svg><svg class="demo-stop" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="start-offset-row"><label for="songStartOffset">Start offset</label><span class="start-slider"><input id="songStartOffset" type="range" min="0" max="0" step="1" value="0" disabled><span id="startTicks" class="start-ticks" aria-hidden="true"></span></span><output id="startOffsetValue" for="songStartOffset">0s</output></div>
  <div class="timing-row"><label for="offset">Music timing</label><span class="timing-slider"><input id="offset" type="range" min="-1" max="1" step="any" value="0"></span><button id="offsetValue" type="button" class="timing-reset" aria-label="Reset music timing to zero">0 ms</button></div>
  <div class="camera-facing-row"><span>Camera</span><div class="segmented" role="group" aria-label="Camera facing"><button id="front" type="button" aria-pressed="false">Front</button><button id="back" type="button" aria-pressed="true">Back</button></div></div>
  <div class="settings"><label id="mirrorRow" class="setting"><span>Mirror front camera</span><input type="checkbox" id="mirror" role="switch" checked></label></div>
  <div class="camera-options quality-row"><label>Quality <select id="resolution" aria-label="Camera resolution"><option value="auto">Auto</option><option value="720">720p</option><option value="1080">1080p</option><option value="2160">4K</option></select></label><label>FPS <select id="fps" aria-label="Camera frame rate"><option value="auto">Auto</option><option value="30">30</option><option value="60">60</option></select></label><span id="cameraActual" class="camera-actual"></span></div>
  <div class="delay-row"><span>Start delay</span><div class="delay-picker" role="group" aria-label="Recording start delay"><button type="button" class="delay-option" data-delay="0" aria-pressed="true">0s</button><button type="button" class="delay-option" data-delay="3" aria-pressed="false">3s</button><button type="button" class="delay-option" data-delay="5" aria-pressed="false">5s</button></div></div>

  <div class="actions"><button id="camera" class="secondary"><svg class="icon"><use id="cameraIcon" href="#i-camera"/></svg><span id="cameraLabel">Camera</span></button>
  <button id="record" class="primary" disabled><span class="record-dot"></span> Record</button><button id="stop" class="stop" hidden><span class="stop-square"></span><span id="stopLabel">Stop</span></button><button id="again" class="secondary destructive" hidden><svg class="icon"><use href="#i-close"/></svg> Record again</button><button id="save" class="primary" hidden><svg class="icon"><use href="#i-save"/></svg> Save video</button><button id="photo" class="secondary photo-button" type="button" aria-label="Take photo" disabled><svg class="icon"><use id="photoIcon" href="#i-camera"/></svg></button></div>
</section>
<p id="status" role="status" aria-live="polite"></p></main><script type="module" src="/app.js?v=30"></script></body></html>
