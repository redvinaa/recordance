<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#15131d"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><title>Recordance</title></head>
<body><main><header><h1>Recordance</h1><p>Move to your music. Keep the moment.</p></header>
<section id="setup"><label class="file">Choose a song<input id="song" type="file" accept="audio/*"></label><p id="songName" class="muted">No song selected</p><button id="camera">Turn on camera</button><label class="check"><input type="checkbox" id="mic"> Include microphone sound</label><video id="live" playsinline muted autoplay></video><button id="record" class="primary" disabled>Record</button><button id="stop" class="danger" hidden>Stop recording</button></section>
<section id="review" hidden><video id="preview" playsinline controls></video><div class="offset-head"><label for="offset">Music timing</label><output id="offsetValue">0 ms</output></div><input id="offset" type="range" min="-1000" max="1000" step="10" value="0"><div class="ends"><span>Music earlier</span><span>Music later</span></div><p class="muted">Adjust while playing. Timing is relative to the original recording.</p><button id="save" class="primary">Save video</button><button id="again">Record again</button></section>
<p id="status" role="status" aria-live="polite"></p><p class="muted small">Your song and recordings stay on this device. Keep this page open while saving.</p></main><script type="module" src="/app.js"></script></body></html>
