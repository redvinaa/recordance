<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/style.css"><title>Recordance</title>
</head>
<body>
<svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l10-2v13M9 18c0 1.4-1.4 2.5-3 2.5S3 19.7 3 18.5 4.4 16 6 16s3 .8 3 2Zm10-2c0 1.4-1.4 2.5-3 2.5s-3-.8-3-2 1.4-2.5 3-2.5 3 .8 3 2Z"/></symbol><symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h3l1.5-2h7L17 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></symbol><symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></symbol><symbol id="i-again" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8L4 9M4 4v5h5"/></symbol></svg>
<main><header><span class="eyebrow">YOUR CAMERA, YOUR MUSIC</span><h1>Recordance</h1><p>Make a moment worth keeping.</p></header>
<section id="setup">
  <div class="section-title">Music</div>
  <label class="file row-button"><span class="icon-tile"><svg class="icon"><use href="#i-music"/></svg></span><span class="row-text"><strong>Choose a song</strong><small id="songName">Select an audio file from Files</small></span><span class="chevron" aria-hidden="true">›</span><input id="song" type="file" accept=".mp3,.m4a,.aac,.wav,.aiff,.aif,.flac,.ogg,.opus"></label>
  <p class="hint">On iPhone, choose Browse to open Files.</p>
  <div class="section-title camera-title">Camera</div>
  <div class="segmented" role="group" aria-label="Camera facing"><button id="front" type="button" aria-pressed="true">Front</button><button id="back" type="button" aria-pressed="false">Back</button></div>
  <div class="settings"><label id="mirrorRow" class="setting"><span>Mirror front camera</span><input type="checkbox" id="mirror" role="switch" checked></label><label class="setting"><span>Record microphone</span><input type="checkbox" id="mic" role="switch"></label></div>
  <div id="liveFrame" class="video-frame empty"><video id="live" playsinline muted autoplay></video><div class="camera-placeholder"><svg class="icon"><use href="#i-camera"/></svg><span>Camera preview</span></div></div>
  <button id="camera" class="secondary"><svg class="icon"><use href="#i-camera"/></svg> Turn on camera</button>
  <button id="record" class="primary" disabled><span class="record-dot"></span> Record</button><button id="stop" class="stop" hidden><span class="stop-square"></span> Stop recording</button>
</section>
<section id="review" hidden><div class="section-title">Your recording</div><div class="video-frame review-frame"><video id="preview" playsinline controls></video></div><div class="timing"><div class="offset-head"><label for="offset">Music timing</label><output id="offsetValue">0 ms</output></div><input id="offset" type="range" min="-1000" max="1000" step="10" value="0"><div class="ends"><span>Earlier</span><span>Later</span></div><p class="hint">Adjust while playing to sync the music to your movement.</p></div><button id="save" class="primary"><svg class="icon"><use href="#i-save"/></svg> Save video</button><button id="again" class="secondary"><svg class="icon"><use href="#i-again"/></svg> Record again</button></section>
<p id="status" role="status" aria-live="polite"></p><footer>Your music and videos stay on this device.</footer></main><script type="module" src="/app.js"></script></body></html>
